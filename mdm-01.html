<!DOCTYPE html>
<html>
<head>
  <title>Unique Tags Demo</title>
</head>
<body>
  <mark>Highlighted text</mark><br>
  <small>Smaller text size</small><br>
  <abbr title="HyperText Markup Language">HTML</abbr><br>
  <cite>Book Title</cite><br>
  <code>print("Hello")</code><br>
  <kbd>Ctrl + C</kbd><br>
  <progress value="70" max="100"></progress><br>
  <meter value="0.6">60%</meter><br>
  <time datetime="2026-07-12">July 12, 2026</time><br>
  <details>
    <summary>Click to expand</summary>
    Hidden info inside details tag
  </details>
</body>
</html>
