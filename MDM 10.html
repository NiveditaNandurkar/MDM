<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study & Wellness Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white shadow-lg rounded-lg w-full max-w-lg p-6">
    <h1 class="text-2xl font-bold text-center text-indigo-600 mb-4">📅 Study & Wellness Planner</h1>

    <!-- Input Section -->
    <div class="flex flex-col sm:flex-row gap-2 mb-4">
      <input id="taskInput" type="text" placeholder="Enter a task..."
        class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-indigo-300">
      
      <select id="category" class="border rounded px-2 py-2">
        <option value="Academic">Academic</option>
        <option value="Personal">Personal</option>
      </select>

      <button onclick="addTask()"
        class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600">Add</button>
    </div>

    <!-- Task List -->
    <ul id="taskList" class="space-y-2"></ul>
  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const categorySelect = document.getElementById("category");
    const taskList = document.getElementById("taskList");

    function addTask() {
      const taskText = taskInput.value.trim();
      const category = categorySelect.value;
      if (taskText === "") return;

      const li = document.createElement("li");
      li.className = "flex justify-between items-center bg-gray-50 p-2 rounded shadow";

      // Task text
      const span = document.createElement("span");
      span.textContent = `[${category}] ${taskText}`;
      span.className = "flex-1 cursor-pointer";
      span.onclick = () => span.classList.toggle("line-through");

      // Delete button
      const delBtn = document.createElement("button");
      delBtn.textContent = "❌";
      delBtn.className = "ml-2 text-red-500 hover:text-red-700";
      delBtn.onclick = () => li.remove();

      li.appendChild(span);
      li.appendChild(delBtn);
      taskList.appendChild(li);

      taskInput.value = "";
    }
  </script>

</body>
</html>
