<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .form-box {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="form-box">
    <h2>Student Registration</h2>

    <form id="registrationForm">

        <label>Name:</label>
        <input type="text" id="name">

        <label>Email:</label>
        <input type="text" id="email">

        <label>Password:</label>
        <input type="password" id="password">

        <label>Mobile Number:</label>
        <input type="text" id="mobile">

        <p id="error" class="error"></p>

        <button type="submit">Register</button>
    </form>
</div>

<script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {

        event.preventDefault();

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let password = document.getElementById("password").value;
        let mobile = document.getElementById("mobile").value.trim();
        let error = document.getElementById("error");

        // Mandatory fields
        if (name === "" || email === "" || password === "" || mobile === "") {
            error.innerHTML = "All fields are mandatory.";
            return;
        }

        // Email validation
        let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {
            error.innerHTML = "Enter a valid email address.";
            return;
        }

        // Password validation
        if (password.length < 8) {
            error.innerHTML = "Password must be at least 8 characters.";
            return;
        }

        // Mobile validation
        let mobilePattern = /^[0-9]{10}$/;

        if (!mobilePattern.test(mobile)) {
            error.innerHTML = "Mobile number must contain exactly 10 digits.";
            return;
        }

        error.style.color = "green";
        error.innerHTML = "Registration successful!";
    });
</script>

</body>
</html>
